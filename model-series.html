<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Series Guides</title>

<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#333333;
  --muted:#777777;
  --border:#cccccc;
  --soft:#eaeaea;
  --link:#1f789d;
}

body.dark-mode{
  --bg:#151515;
  --card:#242424;
  --text:#eeeeee;
  --muted:#bbbbbb;
  --border:#555555;
  --soft:#333333;
  --link:#7cc7e8;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:34px;
}

.logo{
  height:48px;
  width:auto;
}

.top-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}

.top-button{
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  min-width:44px;
  height:44px;
  padding:0;
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:26px;
  font-weight:900;
  font-family:Arial,sans-serif;
  line-height:44px;
  box-sizing:border-box;
}

.icon-back{
  position:relative;
  top:-1px;
  font-size:28px;
}

.icon-home{
  position:relative;
  top:-2px;
  font-size:30px;
}

.theme-icon{
  font-size:22px;
  font-weight:700;
}
.page-title{
  text-align:center;
  margin-bottom:28px;
  font-size:26px;
  font-weight:bold;
}

.intro{
  text-align:center;
  color:var(--muted);
  margin-bottom:30px;
  font-size:16px;
}

.guide-list{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.guide-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px;
  box-sizing:border-box;
}

.guide-title{
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.guide-description{
  color:var(--muted);
  font-size:16px;
  line-height:1.5;
  margin-bottom:20px;
}

.guide-introduced{
  color:var(--muted);
  font-size:15px;
  margin:-2px 0 14px;
}

.image-row{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:28px;
  align-items:center;
}

.logo-image{
  width:100%;
  max-height:180px;
  object-fit:contain;
  background:var(--soft);
  border-radius:8px;
}

.example-image{
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:var(--soft);
  border-radius:8px;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:18px;
}

@media(max-width:800px){
  body{
    padding:14px;
  }

  .page-title{
    font-size:24px;
  }

  .guide-card{
    padding:18px;
  }

  .guide-title{
    font-size:26px;
  }

  .image-row{
    grid-template-columns:1fr;
    gap:16px;
  }

  .logo-image{
    max-height:160px;
  }

  .example-image{
    max-height:none;
  }
}


/* Soft no-frame design update – permanent */
:root{
  --soft-surface:rgba(0,0,0,.035);
  --soft-control:rgba(0,0,0,.055);
  --soft-control-hover:rgba(0,0,0,.085);
}

body.dark-mode{
  --soft-surface:rgba(255,255,255,.035);
  --soft-control:rgba(255,255,255,.055);
  --soft-control-hover:rgba(255,255,255,.085);
}

.top-button,
.portal-button,
.tribute-button,
.guide-select,
.filter-select,
.compare-button,
.compare-cancel,
.access-login-button,
.claim-button,
.close-button,
.secondary-button,
.login-status:not(.is-signin),
input,
select,
textarea,
button:not(.submit-button):not(.remove-button):not(.admin-button){
  border:0 !important;
  background:var(--soft-control) !important;
  box-shadow:none !important;
}

.top-button:hover,
.portal-button:hover,
.tribute-button:hover,
.guide-select:hover,
.filter-select:hover,
.compare-button:hover,
.compare-cancel:hover,
.access-login-button:hover,
.claim-button:hover,
.close-button:hover,
.secondary-button:hover,
.login-status:not(.is-signin):hover,
button:not(.submit-button):not(.remove-button):not(.admin-button):hover{
  background:var(--soft-control-hover) !important;
}

.form-card,
.status-box,
.status,
.access-box,
.help-card,
.guide-card,
.login-menu,
.modal-content,
.claim-brochure-title,
[style*="border:1px solid var(--border)"],
[style*="border: 1px solid var(--border)"]{
  border:0 !important;
  background:var(--soft-surface) !important;
  box-shadow:none !important;
}

.submit-button{
  border:0 !important;
}

.remove-button,
.admin-button{
  border:0 !important;
}

/* Image enlargement/lightbox for model series guide images */
.zoomable-image{
  cursor:zoom-in;
}

.lightbox-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(0,0,0,.86);
  box-sizing:border-box;
}

.lightbox-overlay.is-open{
  display:flex;
}

.lightbox-image{
  cursor:zoom-out;
  max-width:96vw;
  max-height:88vh;
  object-fit:contain;
  background:var(--card);
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.lightbox-close{
  position:fixed;
  top:14px;
  right:16px;
  width:46px;
  height:46px;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.14) !important;
  color:#ffffff;
  font-size:34px;
  line-height:42px;
  cursor:pointer;
}

.lightbox-close:hover{
  background:rgba(255,255,255,.22) !important;
}

.lightbox-caption{
  position:fixed;
  left:24px;
  right:24px;
  bottom:14px;
  text-align:center;
  color:#ffffff;
  font-size:15px;
  line-height:1.4;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}

@media(max-width:800px){
  .lightbox-overlay{
    padding:12px;
  }

  .lightbox-image{
    max-width:98vw;
    max-height:84vh;
  }

  .lightbox-caption{
    left:12px;
    right:12px;
    font-size:14px;
  }
}

</style>

<script data-goatcounter="https://oyvindhaugland.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</head>

<body>

<div class="container">

  <div class="header">
    <img class="logo"
         id="siteLogo"
         src="Car Stereo Garage2_3.png"
         alt="Car Stereo Brochures">

    <div class="top-buttons">
<a class="top-button"
   href="index.html"
   title="Back to main menu">
  <span class="icon-back">←</span>
</a>

      <a class="top-button"
         href="index.html"
         title="Home">
        <span class="icon-home">⌂</span>
      </a>
      <button type="button"
        class="top-button"
        onclick="toggleTheme()"
        id="themeToggle"
        title="Toggle dark mode">
  <span class="theme-icon">◐</span>
</button>
      
    </div>
  </div>

  <div class="page-title" id="pageTitle">Model Series Guides</div>

  <div class="intro" id="introText">
    Loading model series guide...
  </div>

  <div class="guide-list" id="guideList">
    <div class="loading">Loading...</div>
  </div>

</div>


<div class="lightbox-overlay"
     id="imageLightbox"
     aria-hidden="true"
     role="dialog"
     aria-label="Enlarged image">
  <button type="button"
          class="lightbox-close"
          id="lightboxClose"
          aria-label="Close enlarged image">×</button>
  <img class="lightbox-image"
       id="lightboxImage"
       src=""
       alt="">
  <div class="lightbox-caption"
       id="lightboxCaption"></div>
</div>

<script>
const API_BASE = "https://api.carstereogarage.com";

function applySavedTheme(){
  const savedTheme = localStorage.getItem("brochureTheme") || "dark";
  const logo = document.getElementById("siteLogo");

  if(savedTheme === "dark"){
    document.body.classList.add("dark-mode");
    logo.src = "Car Stereo Garage2_3.png";
  } else {
    document.body.classList.remove("dark-mode");
    logo.src = "Car Stereo Garage2_3.png";
  }
}

function toggleTheme(){

  const isDark =
    document.body.classList.toggle("dark-mode");

  const button =
    document.getElementById("themeToggle");

  if(isDark){

    localStorage.setItem("brochureTheme", "dark");

    document.getElementById("siteLogo").src =
      "Car Stereo Garage2_3.png";

    button.title = "Toggle light mode";

  } else {

    localStorage.setItem("brochureTheme", "light");

    document.getElementById("siteLogo").src =
      "Car Stereo Garage2_3.png";

    button.title = "Toggle dark mode";

  }
loadModelSeries().catch(error => {
  console.error(error);

  document.getElementById("guideList").innerHTML =
    `<div class="loading">Could not load model series guides.<br><br>${esc(error.message)}</div>`;
});
}
  
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char];
  });
}

function getLinkedValue(value){
  if (!value) return "";

  if (Array.isArray(value)) {
    return value.map(x => x.value || x.name || "").filter(Boolean).join(", ");
  }

  if (typeof value === "object") {
    return value.value || value.name || "";
  }

  return value;
}

function getFileUrl(value){
  if (!value) return "";

  if (Array.isArray(value)) {
    return (
      value[0]?.url ||
      value[0]?.thumbnails?.card_cover?.url ||
      value[0]?.thumbnails?.small?.url ||
      ""
    );
  }

  if (typeof value === "object") {
    return value.url || "";
  }

  return "";
}

async function loadModelSeries(){
  applySavedTheme();

  const params = new URLSearchParams(window.location.search);
  const brandFilter = params.get("brand") || "";

  const pageTitle = document.getElementById("pageTitle");
  const introText = document.getElementById("introText");
  const guideList = document.getElementById("guideList");

  if(brandFilter){
    pageTitle.innerText = brandFilter + " Model Series Guides";
    introText.innerText = "Overview of " + brandFilter + " model series used in brochures and product catalogs.";
  } else {
    pageTitle.innerText = "Model Series Guides";
    introText.innerText = "Choose a brand from the portal to open its model series guide.";
  }

  const res = await fetch(`${API_BASE}/model-series-guides`);

if(!res.ok){
  throw new Error("Could not load model series guides");
}

const data = await res.json();
const allRows = data.results || [];

  const guides = allRows
    .map(item => ({
      name: item.field_8501352 || "",
      brand: getLinkedValue(item.field_8501353),
      logo: getFileUrl(item.field_8503005),
      logo_dark: getFileUrl(item.field_8509524),
      example: getFileUrl(item.field_8503078),
      example_dark: getFileUrl(item.field_8509816),
      description: item.field_8503087 || "",
      year_from: item.field_9900818 ?? "",
      active:
        item.field_8501354?.value ||
        item.field_8501354 ||
        "",
      sort_order: Number(item.field_8503101 || 0)
    }))
    .filter(item => item.active === "Active")
    .filter(item => {
      if(!brandFilter) return true;
      return item.brand === brandFilter;
    })
    .sort((a,b) => a.sort_order - b.sort_order);

  guideList.innerHTML = "";

  if(guides.length === 0){
    guideList.innerHTML = `<div class="loading">No model series guides found.</div>`;
    return;
  }

 guides.forEach(item => {

  const savedTheme =
    localStorage.getItem("brochureTheme") || "light";

  const logoToUse =
    savedTheme === "dark" && item.logo_dark
      ? item.logo_dark
      : item.logo;

  const exampleToUse =
    savedTheme === "dark" && item.example_dark
      ? item.example_dark
      : item.example;

  // Enlarged images use the dark variant whenever one exists.
  // This also gives light mode a better-looking image on the dark lightbox background.
  const logoFullSize = item.logo_dark || logoToUse;
  const exampleFullSize = item.example_dark || exampleToUse;
   
  guideList.innerHTML += `
    <div class="guide-card">

      <div class="guide-title">
        ${esc(item.name)}
      </div>

      ${
        String(item.year_from).trim()
          ? `<div class="guide-introduced">Introduced in ${esc(item.year_from)}</div>`
          : ``
      }

      ${
        item.description
          ? `<div class="guide-description">${esc(item.description)}</div>`
          : ``
      }

      <div class="image-row">

        ${
          logoToUse
            ? `<img class="logo-image zoomable-image"
                    src="${esc(logoToUse)}"
                    data-full-src="${esc(logoFullSize)}"
                    loading="lazy"
                    alt="${esc(item.name)} logo">`
            : `<div></div>`
        }

        ${
          exampleToUse
          ? `<img class="example-image zoomable-image"
          src="${esc(exampleToUse)}"
          data-full-src="${esc(exampleFullSize)}"
          loading="lazy"
          alt="${esc(item.name)} example">`
          : `<div></div>`
        }

      </div>

    </div>
  `;
});
}


function openImageLightbox(src, caption){
  if(!src) return;

  const overlay = document.getElementById("imageLightbox");
  const image = document.getElementById("lightboxImage");
  const captionElement = document.getElementById("lightboxCaption");

  image.src = src;
  image.alt = caption || "Enlarged image";
  captionElement.innerText = caption || "";

  overlay.classList.add("is-open");
  overlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeImageLightbox(){
  const overlay = document.getElementById("imageLightbox");
  const image = document.getElementById("lightboxImage");

  overlay.classList.remove("is-open");
  overlay.setAttribute("aria-hidden", "true");
  image.src = "";
  document.body.style.overflow = "";
}

document.addEventListener("click", event => {
  const zoomImage = event.target.closest(".zoomable-image");

  if(zoomImage){
    openImageLightbox(
      zoomImage.dataset.fullSrc || zoomImage.currentSrc || zoomImage.src,
      zoomImage.alt || ""
    );
    return;
  }

  if(
    event.target.id === "imageLightbox" ||
    event.target.id === "lightboxClose" ||
    event.target.id === "lightboxImage"
  ){
    closeImageLightbox();
  }
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    closeImageLightbox();
  }
});

loadModelSeries();
</script>

</body>
</html>
