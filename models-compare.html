<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Models – Car Stereo Garage</title>
<style>
:root{--bg:#111;--surface:#1b1b1b;--card:#222;--soft:#2a2a2a;--border:#3d3d3d;--text:#f4f4f4;--muted:#bdbdbd;--link:#5cc4f3;--accent:#1f789d}
:root[data-theme="light"]{--bg:#f2f3f5;--surface:#fff;--card:#fff;--soft:#f1f3f5;--border:#d7dbe0;--text:#171717;--muted:#666;--link:#006da0;--accent:#1f789d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.container{max-width:1600px;margin:auto;padding:24px}
.header{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.logo{width:260px;max-width:58vw}
.top-buttons{display:flex;justify-content:center;gap:10px}
.top-button{width:44px;height:44px;border:0;border-radius:8px;background:var(--soft);color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:23px;cursor:pointer}
.top-button.active{background:var(--accent);color:#fff}
#compareControlsToggle.compare-active{background:var(--accent);color:#fff}
.compare-actions{
  position:fixed;
  z-index:1000;
  top:18px;
  right:18px;
  display:none;
  justify-content:center;
  gap:10px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
  box-shadow:0 4px 16px rgba(0,0,0,.35);
}
.compare-actions.active{display:flex}
.compare-action-button{
  min-height:36px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 15px;
  background:var(--soft);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}
.compare-action-button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.page-title{font-size:30px;font-weight:700;margin-bottom:7px}
.intro{color:var(--muted);margin-bottom:18px}
.status{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.compare-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.compare-table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:13px}
.compare-table th,.compare-table td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 10px;vertical-align:top;max-width:220px}
.compare-table th{position:sticky;top:0;z-index:5;background:var(--soft);text-align:left;white-space:nowrap}
.compare-table tr:last-child td{border-bottom:0}
.compare-table th:last-child,.compare-table td:last-child{border-right:0}
.compare-image-col{width:130px;min-width:130px}
.compare-model-col{width:150px;min-width:150px}
.compare-wide-text{width:440px;min-width:440px;max-width:440px}
.compare-table th:nth-child(1),.compare-table td:nth-child(1){position:sticky;left:0;z-index:4;background:var(--surface)}
.compare-table th:nth-child(2),.compare-table td:nth-child(2){position:sticky;left:130px;z-index:4;background:var(--surface)}
.compare-table th:nth-child(1),.compare-table th:nth-child(2){z-index:7;background:var(--soft)}
.compare-image{width:110px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.compare-image img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.compare-image-placeholder{font-size:10px;color:var(--muted);text-align:center;padding:5px}
.model-name{font-weight:700;font-size:15px}
.secondary{color:var(--muted);margin-top:4px;font-size:12px}
.value-yes{font-weight:700}
.version{margin:24px 0 8px;text-align:center;font-size:11px;color:var(--muted);opacity:.75}
@media(max-width:700px){
  .container{padding:12px}
  .compare-actions{
    top:auto;
    right:12px;
    bottom:12px;
    left:12px;
    justify-content:center;
  }
  .logo{width:220px;max-width:90vw}
  .page-title{font-size:26px}

  /* On phones the image column must scroll away. Keeping both Image + Model
     sticky consumes almost the entire viewport. Only the model identity stays. */
  .compare-table th:nth-child(1),
  .compare-table td:nth-child(1){
    position:static;
    left:auto;
    z-index:auto;
  }

  .compare-table th:nth-child(2),
  .compare-table td:nth-child(2){
    position:sticky;
    left:0;
    z-index:6;
    width:42px;
    min-width:42px;
    max-width:42px;
    padding:5px 3px;
    background:var(--surface);
    text-align:center;
  }

  .compare-table th:nth-child(2){
    z-index:8;
    background:var(--soft);
    font-size:0;
  }

  /* Small vertical "Model" label in the sticky header. */
  .compare-table th:nth-child(2)::after{
    content:"Model";
    display:inline-block;
    font-size:11px;
    color:var(--text);
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    letter-spacing:.2px;
  }

  .compare-model-col{
    width:42px;
    min-width:42px;
  }

  .model-name{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    width:100%;
    min-height:96px;
    font-size:12px;
    white-space:nowrap;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
  }

  .model-brand,
  .model-number{
    display:inline;
  }

  .compare-image-col{
    width:112px;
    min-width:112px;
  }

  .compare-image{
    width:96px;
    height:54px;
  }

  .compare-wide-text{
    width:286px;
    min-width:286px;
    max-width:286px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" id="siteLogo" src="Car Stereo Garage2_3.png" alt="Car Stereo Garage">
    <div class="top-buttons">
      <button type="button" class="top-button" id="backButton" title="Back to models">←</button>
      <a class="top-button" href="index.html" title="Home">⌂</a>
      <button type="button" class="top-button" id="compareControlsToggle" title="Compare options" aria-label="Compare options">⇄</button>
      <button type="button" class="top-button" id="themeToggle" title="Toggle light/dark mode">◐</button>
    </div>
    <div class="compare-actions" id="compareActions">
      <button type="button" class="compare-action-button primary" id="reselectModelsButton">Reselect models</button>
      <button type="button" class="compare-action-button" id="cancelCompareButton">Cancel Compare</button>
    </div>
  </div>

  <div class="page-title">Compare Models</div>
  <div class="intro" id="intro">Loading selected models...</div>
  <div id="status" class="status">Loading model data...</div>
  <div id="compareWrap" class="compare-wrap" style="display:none">
    <table class="compare-table" id="compareTable"></table>
  </div>

  <div class="version">models-compare.html V20260809-0255</div>
</div>

<script>
const API_BASE = "https://api.carstereogarage.com";
let selectedRowIds = [];
let compareControlsVisible = true;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyTheme(){
  const saved = localStorage.getItem("theme") || "dark";
  document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("theme", next);
  applyTheme();
}
$("themeToggle").addEventListener("click", toggleTheme);

function updateCompareControls(){
  $("compareActions").classList.toggle("active", compareControlsVisible);

  // A comparison is active for the entire lifetime of this page.
  // Green indicates active Compare mode; clicking the button only shows/hides
  // the floating Reselect/Cancel controls.
  $("compareControlsToggle").classList.add("compare-active");
}

$("compareControlsToggle").addEventListener("click", ()=>{
  // Compare is already active on this page. Clicking the active Compare
  // button therefore has exactly the same meaning as Cancel Compare.
  location.href = "models.html";
});

$("backButton").addEventListener("click", ()=>{
  if(history.length > 1){
    history.back();
  }else{
    location.href = "models.html";
  }
});

$("reselectModelsButton").addEventListener("click", ()=>{
  const rows = selectedRowIds.join("|");
  location.href = rows
    ? `models.html?compare_rows=${encodeURIComponent(rows)}`
    : "models.html";
});

$("cancelCompareButton").addEventListener("click", ()=>{
  // Cancel means the compare session is finished: return with no selection.
  location.href = "models.html";
});

applyTheme();
updateCompareControls();

async function fetchJson(url){
  const res = await fetch(url, {credentials:"omit", mode:"cors"});
  const text = await res.text();
  let data = null;
  try{data=text?JSON.parse(text):null}catch(_){data=text}
  if(!res.ok) throw new Error(data?.detail || data?.error || text || `HTTP ${res.status}`);
  return data;
}

function isMeaningful(value){
  if(value === null || value === undefined || value === "") return false;
  if(value === false) return false;
  if(typeof value === "string" && value.trim().toLowerCase() === "none") return false;
  if(Array.isArray(value)) return value.some(isMeaningful);
  return true;
}

function displayValue(value){
  if(Array.isArray(value)) return value.filter(isMeaningful).join(", ");
  if(value === true) return "Yes";
  if(value === false) return "";
  return String(value ?? "");
}

function compactNumber(value){
  const text=String(value ?? "").trim();
  if(!/^-?\d+(?:\.\d+)?$/.test(text)) return text;
  const n=Number(text);
  return Number.isFinite(n) ? String(n) : text;
}

function fieldDisplayValue(name,value){
  let raw=compactNumber(displayValue(value));
  if(!raw) return "";

  const unitRules=[
    [/^(Width|Height|Depth)$/i," mm"],
    [/Power per Channel$/i," W"],
    [/Maximum Music Power$/i," W"],
    [/Maximum RMS Power$/i," W"],
    [/Output Voltage$/i," mV"],
    [/Signal-to-Noise Ratio$/i," dB"],
    [/Sensitivity$/i," dB"],
    [/THD$/i," %"],
    [/Frequency Response (Low|High)$/i," Hz"]
  ];

  for(const [pattern,unit] of unitRules){
    if(pattern.test(name) && /^-?\d+(?:\.\d+)?$/.test(raw)) return `${raw}${unit}`;
  }
  return raw;
}

function yearText(m){
  const from=Number(m.yearFrom)||null, until=Number(m.yearUntil)||null;
  if(from && until && from!==until) return `${from}–${until}`;
  return from ? String(from) : (until ? String(until) : "");
}
function marketsText(m){return Array.isArray(m.markets) ? m.markets.join(", ") : String(m.markets || "");}
function functionsText(m){return Array.isArray(m.sourceUnitFunctions) ? m.sourceUnitFunctions.join(", ") : "";}

const comparisonColumns = [
  {key:"__image", label:"", special:true},
  {key:"__model", label:"Model", special:true},
  {key:"__type", label:"Type", special:true},
  {key:"__market", label:"Market", special:true},
  {key:"Country", label:"Country"},
  {key:"__year", label:"Year", special:true},
  {key:"__modelSeries", label:"Model Series", special:true},
  {key:"__description", label:"Description", special:true, wideText:true},
  {key:"__functions", label:"Functions", special:true},
  {key:"Preamplifier Features", label:"Preamplifier Features"},
  {key:"Equalizer Type", label:"Equalizer Type"},
  {key:"Amplifier Channels", label:"Amplifier Channels"},
  {key:"Amplifier Features", label:"Amplifier Features"},
  {key:"Amplifier Power per Channel", label:"Amplifier Power per Channel"},
  {key:"Width", label:"Width"},
  {key:"Height", label:"Height"},
  {key:"Depth", label:"Depth"},
  {key:"DIN Size", label:"DIN Size"},
  {key:"Original Currency", label:"Original Currency", currencyRequiresPrice:true},
  {key:"Source Notes", label:"Notes", wideText:true}
];

function detailValue(model,field){
  if(field==="Description") return model.description || model.details?.Description || "";
  return model.details?.[field];
}


function mergedTypeText(model){
  const details = model?.details || {};
  const values = [];

  const add = value => {
    const parts = Array.isArray(value)
      ? value
      : String(value ?? "").split(/[;,]+/);

    for(const part of parts){
      const text = String(part ?? "").trim();
      if(!text) continue;
      if(!values.some(existing => existing.toLowerCase() === text.toLowerCase())){
        values.push(text);
      }
    }
  };

  // Combine these four database columns into the single visible "Type" column.
  add(model?.sourceUnitFunctions);
  add(details["Sound Control Unit"]);
  add(details["Speaker Type"]);
  add(details["Accessory Type"]);

  return values.join(", ");
}

function comparisonValue(model,column){
  switch(column.key){
    case "__type": return mergedTypeText(model);
    case "__market": return marketsText(model);
    case "__year": return yearText(model);
    case "__modelSeries": return model.modelSeries || "";
    case "__description": return model.description || model.details?.Description || "";
    case "__functions": return functionsText(model);
    default: return fieldDisplayValue(column.key, detailValue(model,column.key));
  }
}

function visibleComparisonColumns(models){
  return comparisonColumns.filter(column=>{
    if(column.currencyRequiresPrice){
      // Currency is useful only where at least one compared model has
      // an Original Price. The price itself remains hidden as requested.
      return models.some(model=>isMeaningful(detailValue(model,"Original Price")));
    }
    return true;
  });
}

function modelImageUrl(m){
  return m?.rowId ? `${API_BASE}/models/image?row_id=${encodeURIComponent(m.rowId)}` : "";
}

function render(models){
  const columns=visibleComparisonColumns(models);
  $("intro").textContent=`Comparing ${models.length} models. Scroll horizontally to compare specifications.`;

  const headers=columns.map(column=>{
    if(column.key==="__image") return '<th class="compare-image-col" aria-label="Image"></th>';
    if(column.key==="__model") return '<th class="compare-model-col">Model</th>';
    return `<th${column.wideText ? ' class="compare-wide-text"' : ""}>${esc(column.label)}</th>`;
  }).join("");

  const rows=models.map(m=>{
    const imageUrl=modelImageUrl(m);
    const image=`<div class="compare-image">
      ${imageUrl
        ? `<img src="${esc(imageUrl)}" alt="${esc(m.brand)} ${esc(m.model)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="compare-image-placeholder" style="display:none">No image</div>`
        : '<div class="compare-image-placeholder">No image</div>'}
    </div>`;

    const cells=columns.map(column=>{
      if(column.key==="__image") return `<td>${image}</td>`;
      if(column.key==="__model"){
        return `<td><div class="model-name"><span class="model-brand">${esc(m.brand)}</span> <span class="model-number">${esc(m.model)}</span></div></td>`;
      }

      const value=comparisonValue(m,column);
      return `<td${column.wideText ? ' class="compare-wide-text"' : ""}>${esc(value)}</td>`;
    });

    return `<tr>${cells.join("")}</tr>`;
  }).join("");

  $("compareTable").innerHTML=`<thead><tr>${headers}</tr></thead><tbody>${rows}</tbody>`;
  $("status").style.display="none";
  $("compareWrap").style.display="block";
}
async function init(){
  const p=new URLSearchParams(location.search);
  const rows=[...new Set(
    String(p.get("rows")||"")
      .split(/[|,;]+/)
      .map(x=>Number(x))
      .filter(value=>Number.isFinite(value) && value > 0)
  )];

  selectedRowIds = rows.slice();

  if(rows.length<2){
    $("status").textContent="Select at least two models to compare.";
    return;
  }

  try{
    const data=await fetchJson(`${API_BASE}/models?row_ids=${encodeURIComponent(rows.join("|"))}&summary=0`);
    const models=Array.isArray(data.results) ? data.results : (data.result ? [data.result] : []);

    const byRow=new Map(models.map(m=>[Number(m.rowId),m]));
    const ordered=rows.map(id=>byRow.get(id)).filter(Boolean);

    if(ordered.length<2) throw new Error("Could not load all selected models.");
    render(ordered);
  }catch(error){
    $("status").textContent=`Could not compare models: ${error.message}`;
  }
}
init();
</script>
</body>
</html>
