<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Models – Car Stereo Garage</title>
<style>
:root{--bg:#111;--surface:#1b1b1b;--card:#222;--soft:#2a2a2a;--border:#3d3d3d;--text:#f4f4f4;--muted:#bdbdbd;--link:#5cc4f3;--accent:#1f789d;--danger:#b85c5c}
:root[data-theme="light"]{--bg:#f2f3f5;--surface:#fff;--card:#fff;--soft:#f1f3f5;--border:#d7dbe0;--text:#171717;--muted:#666;--link:#006da0;--accent:#1f789d;--danger:#a94442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.container{max-width:1280px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.logo{width:260px;max-width:58vw}.top-buttons{display:flex;gap:10px}.top-button{width:44px;height:44px;border:0;border-radius:8px;background:var(--soft);color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:23px;cursor:pointer}.page-title{font-size:30px;font-weight:700;margin-bottom:8px}.intro{color:var(--muted);margin-bottom:22px}.filters{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr .75fr 1.4fr;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px}.field label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}.field input,.field select{width:100%;height:42px;border:1px solid var(--border);border-radius:7px;background:var(--soft);color:var(--text);padding:0 11px;font-size:15px}.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;color:var(--muted)}.model-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.model-card{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:15px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px 16px}.model-card:hover{border-color:var(--link)}.model-name{font-size:20px;font-weight:700}.model-functions{color:var(--text)}.model-meta{grid-column:1/-1;color:var(--muted);line-height:1.5}.status{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.detail{display:none}.detail.active{display:block}.detail-title{font-size:30px;font-weight:700;margin-bottom:16px}.image-panel{width:100%;min-height:230px;max-height:380px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:18px;margin-bottom:18px}.image-panel img{display:none;max-width:100%;max-height:340px;object-fit:contain}.image-placeholder{color:var(--muted);font-size:17px}.back-row{margin-bottom:14px}.back-button{border:0;border-radius:7px;background:var(--soft);color:var(--text);padding:10px 14px;font-weight:700;cursor:pointer}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px}.summary-label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:4px}.summary-value{font-size:16px}.spec-section{margin:14px 0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}.spec-title{font-size:18px;font-weight:700;padding:13px 15px;background:var(--soft)}.spec-grid{display:grid;grid-template-columns:1fr 1fr}.spec-row{display:grid;grid-template-columns:minmax(170px,42%) 1fr;gap:10px;padding:10px 15px;border-top:1px solid var(--border)}.spec-row.full-width{grid-column:1 / -1;grid-template-columns:minmax(170px,21%) 1fr}.spec-label{font-weight:700}.spec-value{word-break:break-word}.muted{color:var(--muted)}
@media(max-width:950px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.model-list{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spec-grid{grid-template-columns:1fr}}
@media(max-width:600px){.container{padding:14px}.header{flex-direction:column;align-items:center;justify-content:center;gap:14px}.logo{width:220px;max-width:90vw;margin:0 auto}.top-buttons{justify-content:center;width:100%}.filters{grid-template-columns:1fr}.model-card{grid-template-columns:1fr;gap:4px}.model-functions{grid-column:1}.model-meta{grid-column:1}.summary-grid{grid-template-columns:1fr}.image-panel{min-height:160px;max-height:270px}.image-panel img{max-height:235px}.detail-title{font-size:26px}.spec-row,.spec-row.full-width{grid-template-columns:1fr;gap:4px}}
</style>
<script data-goatcounter="https://oyvindhaugland.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" id="siteLogo" src="Car Stereo Garage2_3.png" alt="Car Stereo Garage">
    <div class="top-buttons">
      <a class="top-button" href="gallery.html" title="Brochures">←</a>
      <a class="top-button" href="index.html" title="Home">⌂</a>
      <button type="button" class="top-button" id="themeToggle" title="Toggle light/dark mode">◐</button>
    </div>
  </div>

  <section id="browserView">
    <div class="page-title">Models</div>
    <div class="intro">Browse and filter models in the Car Stereo Garage model database.</div>
    <div class="filters">
      <div class="field"><label for="brandFilter">Brand</label><select id="brandFilter"><option value="">All brands</option></select></div>
      <div class="field"><label for="seriesFilter">Model Series</label><select id="seriesFilter"><option value="">All series</option></select></div>
      <div class="field"><label for="marketFilter">Market</label><select id="marketFilter"><option value="">All markets</option></select></div>
      <div class="field"><label for="typeFilter">Unit Type</label><select id="typeFilter"><option value="">All types</option></select></div>
      <div class="field"><label for="yearFilter">Year</label><input id="yearFilter" inputmode="numeric" placeholder="e.g. 1981"></div>
      <div class="field"><label for="searchFilter">Model / search</label><input id="searchFilter" placeholder="e.g. 7138"></div>
    </div>
    <div class="results-head"><span id="resultCount"></span><span>Click a model to view details</span></div>
    <div id="listStatus" class="status">Loading models...</div>
    <div id="modelList" class="model-list"></div>
  </section>

  <section id="detailView" class="detail">
    <div class="back-row"><button class="back-button" id="backButton">← Back to models</button></div>
    <div class="detail-title" id="detailTitle"></div>
    <div class="image-panel">
      <img id="modelImage" alt="Model image">
      <div class="image-placeholder" id="imagePlaceholder">No image available</div>
    </div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div id="specSections"></div>
  </section>
</div>
<script>
const API_BASE = "https://api.carstereogarage.com";
let allModels = [];
let filteredModels = [];

const $ = id => document.getElementById(id);
function esc(value){return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function normalized(value){return String(value ?? "").trim().toLowerCase();}
function yearText(model){
  const from = Number(model.yearFrom) || null, until = Number(model.yearUntil) || null;
  if(from && until && from !== until) return `${from}–${until}`;
  if(from) return String(from);
  if(until) return String(until);
  return "";
}
function marketsText(model){return Array.isArray(model.markets) ? model.markets.join(", ") : String(model.markets || "");}
function functionsText(model){return Array.isArray(model.sourceUnitFunctions) ? model.sourceUnitFunctions.join(", ") : "";}

function applyTheme(){
  const saved = localStorage.getItem("theme") || "dark";
  document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
  $("siteLogo").src = saved === "light" ? "Car Stereo Garage2_3.png" : "Car Stereo Garage2_3.png";
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("theme", next); applyTheme();
}
$("themeToggle").addEventListener("click", toggleTheme); applyTheme();

async function fetchJson(url){
  const res = await fetch(url, {credentials:"omit", mode:"cors"});
  const text = await res.text();
  let data = null; try{data=text?JSON.parse(text):null}catch(_){data=text}
  if(!res.ok) throw new Error(data?.detail || data?.error || text || `HTTP ${res.status}`);
  return data;
}
function fillSelect(id, values){
  const select = $(id), current = select.value;
  const first = select.options[0].outerHTML;
  select.innerHTML = first + [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"en",{numeric:true,sensitivity:"base"})).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if([...select.options].some(o=>o.value===current)) select.value=current;
}
function setupFilters(){
  fillSelect("brandFilter", allModels.map(m=>m.brand));
  fillSelect("seriesFilter", allModels.map(m=>m.modelSeries));
  fillSelect("marketFilter", allModels.flatMap(m=>m.markets || []));
  fillSelect("typeFilter", allModels.map(m=>m.unitType));
  ["brandFilter","seriesFilter","marketFilter","typeFilter"].forEach(id=>$(id).addEventListener("change", applyFilters));
  ["yearFilter","searchFilter"].forEach(id=>$(id).addEventListener("input", applyFilters));
}
function applyUrlFilters(){
  const p = new URLSearchParams(location.search);
  const map = {brand:"brandFilter",market:"marketFilter",model_series:"seriesFilter",unit_type:"typeFilter",year:"yearFilter",model:"searchFilter"};
  for(const [key,id] of Object.entries(map)){
    const value = p.get(key); if(value !== null) $(id).value = value;
  }
}
function modelMatchesYear(m, y){
  if(!y) return true; const year=Number(y); if(!Number.isFinite(year)) return true;
  const from=Number(m.yearFrom)||null, until=Number(m.yearUntil)||null;
  if(from && until) return year>=from && year<=until;
  if(from) return year===from;
  if(until) return year===until;
  return false;
}
function applyFilters(){
  const brand=normalized($("brandFilter").value), series=normalized($("seriesFilter").value), market=normalized($("marketFilter").value), type=normalized($("typeFilter").value), year=$("yearFilter").value.trim(), q=normalized($("searchFilter").value);
  filteredModels = allModels.filter(m =>
    (!brand || normalized(m.brand)===brand) &&
    (!series || normalized(m.modelSeries)===series) &&
    (!market || (m.markets||[]).some(x=>normalized(x)===market)) &&
    (!type || normalized(m.unitType)===type) &&
    modelMatchesYear(m,year) &&
    (!q || [m.model,m.brand,m.modelSeries,marketsText(m),functionsText(m),m.description].some(x=>normalized(x).includes(q)))
  );
  renderList();
}
function renderList(){
  $("listStatus").style.display="none";
  $("resultCount").textContent = `${filteredModels.length} model${filteredModels.length===1?"":"s"}`;
  $("modelList").innerHTML = filteredModels.map((m,i)=>`
    <div class="model-card" data-model-id="${esc(m.modelId)}">
      <div class="model-name">${esc(m.brand)} ${esc(m.model)}</div>
      <div class="model-functions">${esc(functionsText(m))}</div>
      <div class="model-meta">${m.modelSeries?`${esc(m.modelSeries)} · `:""}${esc(marketsText(m))}${yearText(m)?` · ${esc(yearText(m))}`:""}</div>
    </div>`).join("");
  document.querySelectorAll(".model-card").forEach(card=>card.addEventListener("click",()=>openModel(card.dataset.modelId)));
}

const coreFields = new Set(["Brand","Model","Model Series","Market","Unit Type","Source Unit Functions","Sold From Year","Sold Until Year","Main Image URL","Description"]);
function groupFor(name){
  const n=String(name);
  if(n.startsWith("Cassette ")) return "Cassette";
  if(n.startsWith("Tuner ")) return "Tuner";
  if(n.startsWith("Preamplifier ")) return "Preamplifier";
  if(n.startsWith("Amplifier ")) return "Amplifier";
  if(n.startsWith("Equalizer ")) return "Equalizer";
  if(n.startsWith("Speaker ")) return "Speaker";
  if(n.startsWith("Crossover ")) return "Crossover";
  if(["Width","Height","Depth","DIN Size"].includes(n)) return "Dimensions";
  return "Other specifications";
}
function displayValue(value){
  if(Array.isArray(value)) return value.filter(isMeaningful).join(", ");
  if(value === true) return "Yes";
  if(value === false) return "";
  return String(value ?? "");
}
function isMeaningful(value){
  if(value === null || value === undefined || value === "") return false;
  // Public model presentation focuses on features/specifications the model has.
  // Negative booleans and explicit None values are therefore omitted.
  if(value === false) return false;
  if(typeof value === "string" && value.trim().toLowerCase() === "none") return false;
  if(Array.isArray(value)) return value.some(isMeaningful);
  return true;
}
function compactNumber(value){
  const text=String(value ?? "").trim();
  if(!/^-?\d+(?:\.\d+)?$/.test(text)) return text;
  const n=Number(text);
  return Number.isFinite(n) ? String(n) : text;
}
function fieldDisplayValue(name,value,details){
  const raw=compactNumber(displayValue(value));
  const units={
    "Amplifier Power per Channel":"W",
    "Preamplifier Output Voltage":"mV",
    "Cassette Signal-to-Noise Ratio":"dB",
    "Width":"mm",
    "Height":"mm",
    "Depth":"mm"
  };
  if(name === "Cassette THD") return `${raw}%`;
  if(name === "Original Price"){
    const currency=details?.["Original Currency"];
    return isMeaningful(currency) ? `${raw} ${displayValue(currency)}` : raw;
  }
  return units[name] ? `${raw} ${units[name]}` : displayValue(value);
}
function publicFieldLabel(name,group){
  const prefix=`${group} `;
  if(group !== "Dimensions" && group !== "Other specifications" && String(name).startsWith(prefix)){
    return String(name).slice(prefix.length);
  }
  return String(name);
}
async function openModel(modelId){
  $("browserView").style.display="none"; $("detailView").classList.add("active");
  $("detailTitle").textContent="Loading model..."; $("summaryGrid").innerHTML=""; $("specSections").innerHTML="";
  try{
    const data=await fetchJson(`${API_BASE}/models?model_id=${encodeURIComponent(modelId)}&summary=0`);
    const m=data.result; if(!m) throw new Error("Model not found");
    $("detailTitle").textContent=`${m.brand} ${m.model}`;
    document.title=`${m.brand} ${m.model} – Car Stereo Garage`;
    const img=$("modelImage"), ph=$("imagePlaceholder");
    const automaticImageUrl = m.modelId
      ? `${API_BASE}/models/image?model_id=${encodeURIComponent(m.modelId)}`
      : "";
    const selectedImageUrl = m.mainImageUrl || automaticImageUrl;

    img.onload = function(){
      img.style.display="block";
      ph.style.display="none";
    };
    img.onerror = function(){
      img.removeAttribute("src");
      img.style.display="none";
      ph.style.display="block";
    };

    if(selectedImageUrl){
      ph.style.display="none";
      img.style.display="none";
      img.src=selectedImageUrl;
    }else{
      img.removeAttribute("src");
      img.style.display="none";
      ph.style.display="block";
    }
    const summary=[
      ["Brand",m.brand],["Model",m.model],["Model Series",m.modelSeries],["Market",marketsText(m)],["Years",yearText(m)],["Unit Type",m.unitType],["Functions",functionsText(m)]
    ].filter(x=>x[1]);
    $("summaryGrid").innerHTML=summary.map(([k,v])=>`<div class="summary-item"><span class="summary-label">${esc(k)}</span><span class="summary-value">${esc(v)}</span></div>`).join("");
    const groups={};
    const details=m.details||{};
    const consumed=new Set();

    // Combine every matching Frequency Response Low/High pair into one
    // user-facing row, e.g. "Frequency Response 40-16000 Hz".
    for(const [name,value] of Object.entries(details)){
      if(coreFields.has(name)||!isMeaningful(value)||consumed.has(name)) continue;

      // Currency is metadata for its price value, not a standalone public specification.
      if(name === "Original Currency") continue;

      const match=String(name).match(/^(.*?)(?:\s+)?Frequency Response Low$/i);
      if(match){
        const prefix=match[1].trim();
        const highName=prefix ? `${prefix} Frequency Response High` : "Frequency Response High";
        const highValue=details[highName];
        if(isMeaningful(highValue)){
          const group=groupFor(name);
          (groups[group] ||= []).push(["Frequency Response",`${displayValue(value)}-${displayValue(highValue)} Hz`]);
          consumed.add(name);
          consumed.add(highName);
          continue;
        }
      }

      if(/Frequency Response High$/i.test(String(name)) && consumed.has(name)) continue;
      const group=groupFor(name); (groups[group] ||= []).push([name,value]);
    }
    const order=["Cassette","Tuner","Preamplifier","Amplifier","Equalizer","Speaker","Crossover","Dimensions","Other specifications"];
    $("specSections").innerHTML=order.filter(g=>groups[g]?.length).map(g=>`<section class="spec-section"><div class="spec-title">${esc(g)}</div><div class="spec-grid">${groups[g].map(([n,v])=>{const label=publicFieldLabel(n,g);const shown=fieldDisplayValue(n,v,details);return `<div class="spec-row${n === "Source Notes" ? " full-width" : ""}"><div class="spec-label">${esc(label)}</div><div class="spec-value">${esc(shown)}</div></div>`;}).join("")}</div></section>`).join("");
    history.replaceState(null,"",`models.html?model_id=${encodeURIComponent(m.modelId)}`);
    scrollTo(0,0);
  }catch(err){$("detailTitle").textContent="Could not load model";$("specSections").innerHTML=`<div class="status">${esc(err.message)}</div>`;}
}
function backToModels(){
  $("detailView").classList.remove("active"); $("browserView").style.display="block"; document.title="Models – Car Stereo Garage"; history.replaceState(null,"","models.html"); scrollTo(0,0);
}
$("backButton").addEventListener("click",backToModels);

async function init(){
  try{
    const data=await fetchJson(`${API_BASE}/models?summary=1`); allModels=data.results||[]; setupFilters(); applyUrlFilters(); applyFilters();
    const p=new URLSearchParams(location.search); const modelId=p.get("model_id");
    if(modelId){await openModel(modelId);return;}
    const model=p.get("model"), brand=p.get("brand"), market=p.get("market");
    if(model && brand){
      const exact=allModels.filter(m=>normalized(m.brand)===normalized(brand) && normalized(m.model)===normalized(model) && (!market || (m.markets||[]).some(x=>normalized(x)===normalized(market))));
      if(exact.length===1) await openModel(exact[0].modelId);
    }
  }catch(err){$("listStatus").textContent=`Could not load models: ${err.message}`;}
}
init();
</script>
</body>
</html>
