<body>
<div class="container">
  <div class="header">
    <img class="logo" id="siteLogo" src="Car Stereo Garage2_3.png" alt="Car Stereo Garage">
    <div class="top-buttons">
      <a class="top-button" id="menuBackButton" href="index.html" title="Back">←</a>
      <a class="top-button" href="index.html" title="Home">⌂</a>
      <button type="button" class="top-button" id="viewToggle" title="Switch to thumbnail view" aria-label="Switch to thumbnail view">▦</button>
      <button type="button" class="top-button" id="themeToggle" title="Toggle light/dark mode">◐</button>
    </div>
  </div>

  <section id="browserView">
    <div class="page-title">Models</div>
    <div class="intro">Browse and filter models in the Car Stereo Garage model database.</div>
    <div class="filters">
      <div class="field"><label for="brandFilter">Brand</label><select id="brandFilter"><option value="">All brands</option></select></div>
      <div class="field"><label for="seriesFilter">Model Series</label><select id="seriesFilter"><option value="">All series</option></select></div>
      <div class="field"><label for="marketFilter">Market</label><select id="marketFilter"><option value="">All markets</option></select></div>
      <div class="field"><label for="typeFilter">Unit Type</label><select id="typeFilter"><option value="">All types</option></select></div>
      <div class="field"><label for="yearFilter">Year</label><input id="yearFilter" inputmode="numeric" placeholder="e.g. 1981"></div>
      <div class="field"><label for="searchFilter">Model / search</label><input id="searchFilter" placeholder="e.g. 7138"></div>
    </div>
    <div class="results-head"><span id="resultCount"></span><span>Click a model to view details</span></div>
    <div id="listStatus" class="status">Loading models...</div>
    <div id="modelList" class="model-list"></div>
  </section>

  <section id="detailView" class="detail">
    <div class="detail-heading-row">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-functions" id="detailFunctions"></div>
    </div>
    <div class="image-panel">
      <img id="modelImage" alt="Model image">
      <div class="image-placeholder" id="imagePlaceholder">No image available</div>
    </div>
    <div class="ai-image-warning detail-ai-warning" id="imageAiWarning" style="display:none">AI-generated: Do not trust the details</div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div id="specSections"></div>
  </section>
</div>
<script>
const API_BASE = "https://api.carstereogarage.com";
let allModels = [];
let filteredModels = [];
let brochureModelNumbers = [];
let modelImageIndex = {};
let modelImageIndexPromise = null;
let viewMode = localStorage.getItem("modelViewMode") === "thumbnail" ? "thumbnail" : "list";

const $ = id => document.getElementById(id);
function esc(value){return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function normalized(value){return String(value ?? "").trim().toLowerCase();}
function yearText(model){
  const from = Number(model.yearFrom) || null, until = Number(model.yearUntil) || null;
  if(from && until && from !== until) return `${from}–${until}`;
  if(from) return String(from);
  if(until) return String(until);
  return "";
}
function marketsText(model){return Array.isArray(model.markets) ? model.markets.join(", ") : String(model.markets || "");}
function functionsText(model){return Array.isArray(model.sourceUnitFunctions) ? model.sourceUnitFunctions.join(", ") : "";}

function applyTheme(){
  const saved = localStorage.getItem("theme") || "dark";
  document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
  $("siteLogo").src = saved === "light" ? "Car Stereo Garage2_3.png" : "Car Stereo Garage2_3.png";
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("theme", next); applyTheme();
}
$("themeToggle").addEventListener("click", toggleTheme); applyTheme();

function updateViewToggle(){
  const button=$("viewToggle");
  const thumbnails=viewMode==="thumbnail";
  button.textContent=thumbnails ? "☷" : "▦";
  button.title=thumbnails ? "Switch to list view" : "Switch to thumbnail view";
  button.setAttribute("aria-label",button.title);
}
function toggleViewMode(){
  viewMode=viewMode==="thumbnail" ? "list" : "thumbnail";
  localStorage.setItem("modelViewMode",viewMode);
  updateViewToggle();
  renderList();
}
$("viewToggle").addEventListener("click",toggleViewMode);
updateViewToggle();

async function fetchJson(url){
  const res = await fetch(url, {credentials:"omit", mode:"cors"});
  const text = await res.text();
  let data = null; try{data=text?JSON.parse(text):null}catch(_){data=text}
  if(!res.ok) throw new Error(data?.detail || data?.error || text || `HTTP ${res.status}`);
  return data;
}
function fillSelect(id, values){
  const select = $(id), current = select.value;
  const first = select.options[0].outerHTML;
  select.innerHTML = first + [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"en",{numeric:true,sensitivity:"base"})).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if([...select.options].some(o=>o.value===current)) select.value=current;
}
function setupFilters(){
  fillSelect("brandFilter", allModels.map(m=>m.brand));
  fillSelect("seriesFilter", allModels.map(m=>m.modelSeries));
  fillSelect("marketFilter", allModels.flatMap(m=>m.markets || []));
  fillSelect("typeFilter", allModels.map(m=>m.unitType));
  ["brandFilter","seriesFilter","marketFilter","typeFilter"].forEach(id=>$(id).addEventListener("change", applyFilters));
  ["yearFilter","searchFilter"].forEach(id=>$(id).addEventListener("input", applyFilters));
}
function applyUrlFilters(){
  const p = new URLSearchParams(location.search);
  const map = {brand:"brandFilter",market:"marketFilter",model_series:"seriesFilter",unit_type:"typeFilter",year:"yearFilter",model:"searchFilter"};

  for(const [key,id] of Object.entries(map)){
    const value = p.get(key);
    if(value !== null) $(id).value = value;
  }

  brochureModelNumbers = String(p.get("models") || "")
    .split("|")
    .map(value => normalized(value))
    .filter(Boolean);
}
function modelMatchesYear(m, y){
  if(!y) return true; const year=Number(y); if(!Number.isFinite(year)) return true;
  const from=Number(m.yearFrom)||null, until=Number(m.yearUntil)||null;
  if(from && until) return year>=from && year<=until;
  if(from) return year===from;
  if(until) return year===until;
  return false;
}
function applyFilters(){
  const brand=normalized($("brandFilter").value), series=normalized($("seriesFilter").value), market=normalized($("marketFilter").value), type=normalized($("typeFilter").value), year=$("yearFilter").value.trim(), q=normalized($("searchFilter").value);
  const brochureModels = new Set(brochureModelNumbers);

  filteredModels = allModels.filter(m =>
    (!brand || normalized(m.brand)===brand) &&
    (!series || normalized(m.modelSeries)===series) &&
    (!market || (m.markets||[]).some(x=>normalized(x)===market)) &&
    (!type || normalized(m.unitType)===type) &&
    modelMatchesYear(m,year) &&
    (!q || [m.model,m.brand,m.modelSeries,marketsText(m),functionsText(m),m.description].some(x=>normalized(x).includes(q))) &&
    (!brochureModels.size || brochureModels.has(normalized(m.model)))
  );
  renderList();
}
function modelImageUrl(m){
  // Image resolution is tied to the unique Baserow row id, not Model ID.
  // This prevents duplicate/copied Model IDs from causing one row's image
  // to overwrite another row's image.
  const rowKey = m?.rowId !== null && m?.rowId !== undefined ? String(m.rowId) : "";
  const indexed = rowKey ? modelImageIndex[rowKey] : null;
  if(indexed?.url) return indexed.url;
  if(rowKey) return `${API_BASE}/models/image?row_id=${encodeURIComponent(rowKey)}`;
  if(m.modelId) return `${API_BASE}/models/image?model_id=${encodeURIComponent(m.modelId)}`;
  return m.mainImageUrl || "";
}

async function ensureModelImageIndex(){
  if(modelImageIndexPromise) return modelImageIndexPromise;

  modelImageIndexPromise = (async()=>{
    try{
      const response = await fetch(`${API_BASE}/models/images`, {cache:"no-store"});
      if(!response.ok) throw new Error(`Image index ${response.status}`);
      const data = await response.json();
      modelImageIndex = data.images || {};
      return modelImageIndex;
    }catch(error){
      modelImageIndex = {};
      return modelImageIndex;
    }
  })();

  return modelImageIndexPromise;
}

function setAiWarningForModel(rowId, warning){
  if(!warning) return;
  const key = rowId !== null && rowId !== undefined ? String(rowId) : "";
  const info = key ? modelImageIndex[key] : null;
  warning.style.display = info?.aiGenerated ? "block" : "none";
}

async function updateAiImageWarning(imageUrl, warning){
  if(!warning) return;
  warning.style.display="none";
  if(!imageUrl || !imageUrl.startsWith(API_BASE)) return;

  try{
    const response=await fetch(imageUrl,{method:"HEAD",cache:"no-store"});
    if(response.ok && response.headers.get("X-Model-Image-AI")==="1"){
      warning.style.display="block";
    }
  }catch(error){
    // Image display must never depend on the optional AI metadata check.
  }
}
function loadModelImage(img, imageUrl, placeholder, warning, loadingText="No image available"){
  if(warning) warning.style.display="none";

  img.onload=null;
  img.onerror=null;

  if(!imageUrl){
    img.removeAttribute("src");
    img.style.display="none";
    if(placeholder){
      placeholder.textContent="No image available";
      placeholder.style.display="block";
    }
    return;
  }

  if(placeholder){
    placeholder.textContent=loadingText;
    placeholder.style.display="block";
  }

  img.onload=function(){
    img.style.display="block";
    if(placeholder) placeholder.style.display="none";
    updateAiImageWarning(imageUrl,warning);
  };

  img.onerror=function(){
    img.removeAttribute("src");
    img.style.display="none";
    if(placeholder){
      placeholder.textContent="No image available";
      placeholder.style.display="block";
    }
    if(warning) warning.style.display="none";
  };

  img.style.display="block";
  img.src=imageUrl;
}

function modelImageDiagnostic(m){
  const rowKey = m?.rowId !== null && m?.rowId !== undefined ? String(m.rowId) : "";
  const indexed = rowKey ? modelImageIndex[rowKey] : null;

  if(indexed?.fileName){
    const folder = String(indexed.folderPath || "").replace(/\/+$/,"");
    const fullPath = folder ? `${folder}/${indexed.fileName}` : indexed.fileName;
    return {
      source:"OneDrive image index",
      path:fullPath,
      file:indexed.fileName
    };
  }

  const markets = Array.isArray(m?.markets) ? m.markets.filter(Boolean) : [];
  const market = markets[0] || "";
  const brand = String(m?.brand || "");
  const model = String(m?.model || "");

  if(market && brand && model){
    return {
      source:"Expected standard path",
      path:`ModellImages/${market}/${brand}/${model}.*`,
      file:`${model}.*`
    };
  }

  if(m?.mainImageUrl){
    return {
      source:"Main Image URL fallback",
      path:String(m.mainImageUrl),
      file:String(m.mainImageUrl).split("/").pop() || ""
    };
  }

  return {
    source:"No image source resolved",
    path:"—",
    file:"—"
  };
}

function modelImageTooltipHtml(m){
  const info = modelImageDiagnostic(m);
  return `
    <div class="model-image-path-tooltip">
      <div><span class="tip-label">Source:</span> ${esc(info.source)}</div>
      <div><span class="tip-label">Path:</span> ${esc(info.path)}</div>
      <div><span class="tip-label">File:</span> <span class="tip-file">${esc(info.file)}</span></div>
      <div><span class="tip-label">Row ID:</span> ${esc(m?.rowId ?? "—")}</div>
      <div><span class="tip-label">Model ID:</span> ${esc(m?.modelId || "—")}</div>
    </div>`;
}

async function renderList(){
  $("listStatus").style.display="none";

  if(viewMode==="thumbnail"){
    await ensureModelImageIndex();
  }
  $("resultCount").textContent = brochureModelNumbers.length
    ? `${filteredModels.length} model${filteredModels.length===1?"":"s"} from brochure`
    : `${filteredModels.length} model${filteredModels.length===1?"":"s"}`;
  const list=$("modelList");
  list.classList.toggle("thumbnail-view",viewMode==="thumbnail");

  if(viewMode==="thumbnail"){
    list.innerHTML = filteredModels.map(m=>{
      const imageUrl=modelImageUrl(m);
      return `
        <div class="model-card" data-model-id="${esc(m.modelId)}" data-row-id="${esc(m.rowId)}">
          ${modelImageTooltipHtml(m)}
          <div class="thumb-image">
            <img data-image-url="${esc(imageUrl)}" alt="${esc(m.brand)} ${esc(m.model)}">
            <div class="thumb-placeholder"${imageUrl?' style="display:none"':""}>No image available</div>
          </div>
          <div class="ai-image-warning" style="display:none">AI-generated: Do not trust the details</div>
          <div class="thumb-caption">
            <div class="thumb-name">${esc(m.brand)} ${esc(m.model)}</div>
            <div class="thumb-year">${esc(yearText(m))}</div>
          </div>
        </div>`;
    }).join("");

    list.querySelectorAll(".thumb-image img").forEach(img=>{
      const ph=img.parentElement.querySelector(".thumb-placeholder");
      const warning=img.parentElement.nextElementSibling;
      const imageUrl=img.dataset.imageUrl || "";
      const card=img.closest(".model-card");
      const rowId=card?.dataset.rowId || "";
      loadModelImage(img,imageUrl,ph,null);
      setAiWarningForModel(rowId,warning);
    });
  }else{
    list.innerHTML = filteredModels.map(m=>`
      <div class="model-card" data-model-id="${esc(m.modelId)}" data-row-id="${esc(m.rowId)}">
        ${modelImageTooltipHtml(m)}
        <div class="model-name">${esc(m.brand)} ${esc(m.model)}</div>
        <div class="model-functions">${esc(functionsText(m))}</div>
        <div class="model-meta">${m.modelSeries?`${esc(m.modelSeries)} · `:""}${esc(marketsText(m))}${yearText(m)?` · ${esc(yearText(m))}`:""}</div>
      </div>`).join("");
  }

  document.querySelectorAll(".model-card").forEach(card=>card.addEventListener("click",()=>openModel(card.dataset.modelId)));
}

const coreFields = new Set(["Brand","Model","Model Series","Market","Unit Type","Source Unit Functions","Sold From Year","Sold Until Year","Main Image URL","Description"]);
function groupFor(name){
  const n=String(name);
  if(n.startsWith("CD ")) return "CD";
  if(n.startsWith("MD ")) return "MD";
  if(n.startsWith("Cassette ")) return "Cassette";
  if(n.startsWith("Tuner ")) return "Tuner";
  if(n.startsWith("Preamplifier ")) return "Preamplifier";
  if(n.startsWith("Amplifier ")) return "Amplifier";
  if(n.startsWith("Equalizer ")) return "Equalizer";
  if(n.startsWith("Speaker ")) return "Speaker";
  if(n.startsWith("Crossover ")) return "Crossover";
  if(["Width","Height","Depth","DIN Size"].includes(n)) return "Dimensions";
  if(n === "Sale Availability" || /^Estimated Value \d+%$/i.test(n)) return "Availability & Value";
  return "Other specifications";
}
function displayValue(value){
  if(Array.isArray(value)) return value.filter(isMeaningful).join(", ");
  if(value === true) return "Yes";
  if(value === false) return "";
  return String(value ?? "");
}
function isMeaningful(value){
  if(value === null || value === undefined || value === "") return false;
  // Public model presentation focuses on features/specifications the model has.
  // Negative booleans and explicit None values are therefore omitted.
  if(value === false) return false;
  if(typeof value === "string" && value.trim().toLowerCase() === "none") return false;
  if(Array.isArray(value)) return value.some(isMeaningful);
  return true;
}
function compactNumber(value){
  const text=String(value ?? "").trim();
  if(!/^-?\d+(?:\.\d+)?$/.test(text)) return text;
  const n=Number(text);
  return Number.isFinite(n) ? String(n) : text;
}
function sortedNoiseReductionSystems(value){
  const values = Array.isArray(value)
    ? value.map(v=>String(v).trim()).filter(Boolean)
    : String(value ?? "").split(/[,;]+/).map(v=>v.trim()).filter(Boolean);

  const order = new Map([
    ["dolby b", 10],
    ["dolby c", 20],
    ["dolby s", 30],
    ["dbx", 40]
  ]);

  return values
    .map((v,index)=>({v,index,rank:order.get(v.toLowerCase()) ?? 1000}))
    .sort((a,b)=>a.rank-b.rank || a.index-b.index)
    .map(x=>x.v)
    .join(", ");
}

function currencySymbol(currency){
  const code=String(currency ?? "").trim().toUpperCase();
  const symbols={
    EUR:"€",
    USD:"$",
    GBP:"£",
    JPY:"¥",
    CNY:"¥",
    KRW:"₩",
    NOK:"kr",
    SEK:"kr",
    DKK:"kr",
    CHF:"CHF",
    CAD:"C$",
    AUD:"A$",
    NZD:"NZ$"
  };
  return symbols[code] || code;
}

function fieldDisplayValue(name,value,details){
  if(name === "Cassette Noise Reduction Systems"){
    return sortedNoiseReductionSystems(value);
  }

  const raw=compactNumber(displayValue(value));
  const units={
    "Amplifier Power per Channel":"W",
    "Amplifier Signal-to-Noise Ratio":"dB",
    "Preamplifier Output Voltage":"mV",
    "Cassette Signal-to-Noise Ratio":"dB",
    "Equalizer Signal-to-Noise Ratio":"dB",
    "Speaker Sensitivity":"dB",
    "Speaker Maximum RMS Power":"W",
    "Speaker Maximum Music Power":"W",
    "CD Signal-to-Noise Ratio":"dB",
    "MD Signal-to-Noise Ratio":"dB",
    "Width":"mm",
    "Height":"mm",
    "Depth":"mm"
  };

  if(["Cassette THD","CD THD","MD THD"].includes(name)) return `${raw}%`;

  if(name === "Original Price"){
    const currency=details?.["Original Currency"];
    return isMeaningful(currency) ? `${raw} ${displayValue(currency)}` : raw;
  }

  if(/^Estimated Value \d+%$/i.test(name)){
    const currency=details?.["Original Currency"];
    const symbol=isMeaningful(currency) ? currencySymbol(currency) : "";
    return symbol ? `${raw} ${symbol}` : raw;
  }

  return units[name] ? `${raw} ${units[name]}` : displayValue(value);
}
function publicFieldLabel(name,group){
  const prefix=`${group} `;
  if(group !== "Dimensions" && group !== "Other specifications" && String(name).startsWith(prefix)){
    return String(name).slice(prefix.length);
  }
  return String(name);
}
function updateMenuBackButton(){
  const button=$("menuBackButton");
  const inDetail=$("detailView").classList.contains("active");

  if(inDetail){
    button.href="models.html";
    button.title="Back to models";
    button.setAttribute("aria-label","Back to models");
  }else{
    button.href="index.html";
    button.title="Back";
    button.setAttribute("aria-label","Back");
  }
}

function canReturnToPreviousPage(){
  if(!document.referrer) return false;

  try{
    const previous=new URL(document.referrer);
    return previous.origin===window.location.origin;
  }catch(error){
    return false;
  }
}

function renderSpecGroup(items, groupName){
  const normal = [];
  const fullWidth = [];

  for(const [name,value] of items){
    const label = publicFieldLabel(name,groupName);
    const shown = fieldDisplayValue(name,value,detailsForRender);
    const html = `<div class="spec-row${name === "Source Notes" ? " full-width" : ""}"><div class="spec-label">${esc(label)}</div><div class="spec-value">${esc(shown)}</div></div>`;

    if(name === "Source Notes") fullWidth.push(html);
    else normal.push(html);
  }

  const rows = [];
  for(let i=0;i<normal.length;i+=2){
    rows.push(`<div class="spec-pair">${normal[i]}${normal[i+1] || "<div></div>"}</div>`);
  }
  for(const html of fullWidth){
    rows.push(`<div class="spec-pair full-width">${html}</div>`);
  }
  return rows.join("");
}

let detailsForRender = null;

async function openModel(modelId, options = {}){
  const historyMode = options.historyMode || "push";
  // Clear the previous detail image immediately so it cannot flash while
  // the next model and image are loading.
  const detailImg=$("modelImage");
  const detailPlaceholder=$("imagePlaceholder");
  const detailAiWarning=$("imageAiWarning");

  detailImg.onload=null;
  detailImg.onerror=null;
  detailImg.removeAttribute("src");
  detailImg.style.display="none";
  detailPlaceholder.textContent="Loading image...";
  detailPlaceholder.style.display="block";
  detailAiWarning.style.display="none";

  $("browserView").style.display="none";
  $("detailView").classList.add("active");
  updateMenuBackButton();
  $("detailTitle").textContent="Loading model..."; $("detailFunctions").textContent=""; $("summaryGrid").innerHTML=""; $("specSections").innerHTML="";
  try{
    const data=await fetchJson(`${API_BASE}/models?model_id=${encodeURIComponent(modelId)}&summary=0`);
    const m=data.result; if(!m) throw new Error("Model not found");
    $("detailTitle").textContent=`${m.brand} ${m.model}`;
    $("detailFunctions").textContent=functionsText(m);
    document.title=`${m.brand} ${m.model} – Car Stereo Garage`;
    const img=$("modelImage"), ph=$("imagePlaceholder"), aiWarning=$("imageAiWarning");
    const rowKey = m?.rowId !== null && m?.rowId !== undefined ? String(m.rowId) : "";
    const indexedImageUrl = rowKey && modelImageIndex[rowKey]?.url
      ? modelImageIndex[rowKey].url
      : "";
    const automaticImageUrl = rowKey
      ? `${API_BASE}/models/image?row_id=${encodeURIComponent(rowKey)}`
      : (m.modelId ? `${API_BASE}/models/image?model_id=${encodeURIComponent(m.modelId)}` : "");
    // Same priority as thumbnail view. Standard Market/Brand/Model image wins;
    // Main Image URL is only a fallback for manually created rows without Model ID.
    const selectedImageUrl = indexedImageUrl || automaticImageUrl || m.mainImageUrl || "";

    ph.style.display=selectedImageUrl ? "none" : "block";
    img.style.display="none";
    aiWarning.style.display="none";
    loadModelImage(img,selectedImageUrl,ph,null,"Loading image...");
    if(m.modelId && modelImageIndex[m.modelId]){
      setAiWarningForModel(m.modelId,aiWarning);
    }else{
      updateAiImageWarning(selectedImageUrl,aiWarning);
    }
    const yearLabel = (m.yearUntil && String(m.yearUntil) !== String(m.yearFrom)) ? "Years" : "Year";
    const summary=[
      ["Model Series",m.modelSeries],
      ["Market",marketsText(m)],
      [yearLabel,yearText(m)]
    ].filter(x=>x[1]);
    $("summaryGrid").innerHTML=summary.map(([k,v])=>`<div class="summary-item"><span class="summary-label">${esc(k)}</span><span class="summary-value">${esc(v)}</span></div>`).join("");
    const groups={};
    const details=m.details||{};
    const consumed=new Set();

    // Combine every matching Frequency Response Low/High pair into one
    // user-facing row, e.g. "Frequency Response 40-16000 Hz".
    for(const [name,value] of Object.entries(details)){
      if(coreFields.has(name)||!isMeaningful(value)||consumed.has(name)) continue;

      // Currency is metadata for its price value, not a standalone public specification.
      if(name === "Original Currency") continue;

      const match=String(name).match(/^(.*?)(?:\s+)?Frequency Response Low$/i);
      if(match){
        const prefix=match[1].trim();
        const highName=prefix ? `${prefix} Frequency Response High` : "Frequency Response High";
        const highValue=details[highName];
        if(isMeaningful(highValue)){
          const group=groupFor(name);
          (groups[group] ||= []).push(["Frequency Response",`${displayValue(value)}-${displayValue(highValue)} Hz`]);
          consumed.add(name);
          consumed.add(highName);
          continue;
        }
      }

      if(/Frequency Response High$/i.test(String(name)) && consumed.has(name)) continue;
      const group=groupFor(name); (groups[group] ||= []).push([name,value]);
    }
    const order=["CD","MD","Cassette","Tuner","Preamplifier","Amplifier","Equalizer","Speaker","Crossover","Dimensions","Other specifications","Availability & Value"];
    detailsForRender = details;
    $("specSections").innerHTML=order
      .filter(g=>groups[g]?.length)
      .map(g=>`<section class="spec-section"><div class="spec-title">${esc(g)}</div><div class="spec-grid">${renderSpecGroup(groups[g],g)}</div></section>`)
      .join("");
    detailsForRender = null;
    const detailUrl = `models.html?model_id=${encodeURIComponent(m.modelId)}`;
    if(historyMode === "push"){
      history.pushState({view:"detail", modelId:m.modelId}, "", detailUrl);
    }else if(historyMode === "replace"){
      history.replaceState({view:"detail", modelId:m.modelId}, "", detailUrl);
    }
    scrollTo(0,0);
  }catch(err){$("detailTitle").textContent="Could not load model";$("detailFunctions").textContent="";$("specSections").innerHTML=`<div class="status">${esc(err.message)}</div>`;}
}
function backToModels(options = {}){
  const historyMode = options.historyMode || "replace";
  const detailImg=$("modelImage");
  detailImg.onload=null;
  detailImg.onerror=null;
  detailImg.removeAttribute("src");
  detailImg.style.display="none";
  $("imagePlaceholder").textContent="No image available";
  $("imagePlaceholder").style.display="block";
  $("imageAiWarning").style.display="none";

  $("detailView").classList.remove("active");
  $("browserView").style.display="block";
  document.title="Models – Car Stereo Garage";
  if(historyMode === "replace"){
    history.replaceState({view:"list"}, "", "models.html");
  }else if(historyMode === "push"){
    history.pushState({view:"list"}, "", "models.html");
  }
  updateMenuBackButton();
  scrollTo(0,0);
}

$("menuBackButton").addEventListener("click",event=>{
  if($("detailView").classList.contains("active")){
    event.preventDefault();

    if(history.state?.view === "detail" && history.length > 1){
      history.back();
    }else{
      backToModels({historyMode:"replace"});
    }
    return;
  }

  if(canReturnToPreviousPage()){
    event.preventDefault();
    history.back();
  }
});

async function init(){
  updateMenuBackButton();
  try{
    const data=await fetchJson(`${API_BASE}/models?summary=1`); allModels=data.results||[]; setupFilters(); applyUrlFilters(); applyFilters();
    const p=new URLSearchParams(location.search); const modelId=p.get("model_id");

    if(modelId){
      history.replaceState({view:"detail", modelId}, "", location.href);
      await openModel(modelId, {historyMode:"none"});
      return;
    }

    history.replaceState({view:"list"}, "", location.href);

    const model=p.get("model"), brand=p.get("brand"), market=p.get("market");
    if(model && brand){
      const exact=allModels.filter(m=>normalized(m.brand)===normalized(brand) && normalized(m.model)===normalized(model) && (!market || (m.markets||[]).some(x=>normalized(x)===normalized(market))));
      if(exact.length===1){
        await openModel(exact[0].modelId, {historyMode:"push"});
      }
    }
  }catch(err){$("listStatus").textContent=`Could not load models: ${err.message}`;}
}

window.addEventListener("popstate", async ()=>{
  const p = new URLSearchParams(location.search);
  const modelId = p.get("model_id");

  if(modelId){
    await openModel(modelId, {historyMode:"none"});
  }else{
    backToModels({historyMode:"none"});
  }
});

init();
</script>
